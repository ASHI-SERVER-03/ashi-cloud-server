<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ASHI ADMIN</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <strong>ASHI ADMIN</strong>
        <span>Biblioteca cloud privada</span>
      </div>
      <button id="logout" type="button">Salir</button>
    </header>

    <section id="login-card" class="card">
      <h1>Acceso propietario</h1>
      <label>Email<input id="email" type="email" autocomplete="username"></label>
      <label>Contrasena<input id="password" type="password" autocomplete="current-password"></label>
      <button id="login" type="button">Entrar</button>
    </section>

    <section id="admin-card" class="card" hidden>
      <div class="toolbar">
        <button id="refresh" type="button">Actualizar</button>
        <button id="new-template" type="button">Nueva plantilla</button>
        <button id="stats" type="button">Estadisticas</button>
      </div>
      <div id="status"></div>
      <div id="grid" class="grid"></div>
      <h2>Plantilla visual</h2>
      <div class="form-grid">
        <label>ID unico<input id="tpl-id" placeholder="subtitulo_pop_001"></label>
        <label>Nombre<input id="tpl-name" placeholder="Subtitulo Pop"></label>
        <label>Tipo
          <select id="tpl-type">
            <option value="highlighted_subtitle">Subtitulo destacado</option>
            <option value="text_animation">Animacion de texto</option>
            <option value="caption_style">Estilo de caption</option>
            <option value="curve_pack">Pack de curvas</option>
            <option value="transition_pack">Pack de transicion</option>
          </select>
        </label>
        <label>Categoria<input id="tpl-category" placeholder="Subtitulos"></label>
        <label>Version<input id="tpl-version" placeholder="1.0.0"></label>
        <label>After Effects minimo<input id="tpl-ae" placeholder="2022"></label>
        <label>Riesgo
          <select id="tpl-risk">
            <option value="medium">Medio</option>
            <option value="low">Bajo</option>
          </select>
        </label>
        <label>Etiquetas<input id="tpl-tags" placeholder="subtitulos, reels, destacado"></label>
      </div>
      <label>Descripcion<textarea id="tpl-description" class="small-area" spellcheck="true"></textarea></label>
      <div class="form-grid">
        <label>Fuente<input id="tpl-font" placeholder="Poppins"></label>
        <label>Color texto<input id="tpl-fill" placeholder="#FFFFFF"></label>
        <label>Color destacado<input id="tpl-highlight" placeholder="#FFE16A"></label>
        <label>Trazo<input id="tpl-stroke" placeholder="#000000"></label>
        <label>Animacion<input id="tpl-variant" placeholder="pop"></label>
        <label>Duracion<input id="tpl-duration" type="number" min="0.05" max="20" step="0.05" placeholder="0.45"></label>
        <label>Ease<input id="tpl-ease" placeholder="smooth"></label>
        <label>Unidad<input id="tpl-unit" placeholder="words"></label>
      </div>
      <label>Prompt interno<textarea id="tpl-prompt" class="small-area" spellcheck="true"></textarea></label>
      <div class="upload-grid">
        <label>Archivo After Effects / plantilla
          <input id="asset-file" type="file" accept=".ffx,.aep,.jsx,.jpg,.jpeg,.png,.webp,.mp4,.mov">
        </label>
        <button id="upload-asset" type="button">Subir archivo</button>
        <label>Preview imagen/video
          <input id="preview-file" type="file" accept=".jpg,.jpeg,.png,.webp,.mp4,.mov">
        </label>
        <button id="upload-preview" type="button">Subir preview</button>
      </div>
      <details>
        <summary>JSON avanzado</summary>
        <textarea id="editor" spellcheck="false"></textarea>
      </details>
      <div class="toolbar">
        <button id="save" type="button">Guardar</button>
        <button id="publish" type="button">Publicar</button>
        <button id="unpublish" type="button">Despublicar</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
